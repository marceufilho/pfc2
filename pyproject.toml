[project]
name = "pfc2"
version = "0.1.0"
description = "PFC2: a small proved subset of C with contracts, laws and a replayable proof file"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=3.46.0",
    "pycparser>=3.12",
    "pygls>=2.0",
    "z3-solver==5.3.3.0",
]

[project.scripts]
pfc2 = "pfc2.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfc2"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: exercises real external tools (Z3 or clang)"]

[tool.mypy]
python_version = "3.11"
files = ["pfc2", "tools"]
strict = true

[[tool.mypy.overrides]]
# z3-solver does not ship PEP 561 typing metadata. Keep the exception at its boundary.
module = ["z3", "z3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pycparser has inline annotations but no py.typed marker; analyze them.
module = ["pycparser", "pycparser.*"]
follow_untyped_imports = true

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
