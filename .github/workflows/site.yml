name: Site (GitHub Pages)

# Builds the static site from the committed, generated data and deploys it to GitHub Pages.
# `make check` (the Check workflow) verifies that the generated data matches the repository.

on:
  push:
    branches: [main, master]
    paths: ["site/**", "showcase/**", "docs/**", "examples/**", "pfc2/**", "tools/site_data.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - name: Runtime of the browser checker (digest-verified wheels)
        run: node site/scripts/prepare-engine.mjs
      - run: pnpm --dir site build
      - name: Browser tests, including every example against its native result
        run: |
          pnpm --dir site exec playwright install --with-deps chromium
          pnpm --dir site exec playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
